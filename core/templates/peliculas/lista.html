{% extends 'base.html' %}
{% load static %}

{% block otros_css %}
<link rel="stylesheet" href="{% static 'css/pelis.css' %}">
{% endblock %}

{% block contenido %}

<!-- SECCION 1 : VIDEOCLUB -->
<!--ENCABEZADO-->

<div class="videoclub-encabezado">
    <div>
        <h1>
            <span>Una tarde</span>
            <img src="{% static 'images/claqueta.png' %}"
                 alt="Claqueta"
                 class="icono-claqueta">
            <span>de película</span>
        </h1>
    </div>
    <p>Nuestra colección de cine con recetas icónicas</p>
</div>

<!-- SECCION 2 : ESTANTERÍA DE PELÍCULAS -->
<section class="videoclub-estanteria">
    <div class="peliculas-estanteria">
		{% for pelicula in peliculas %}
		    <a href="{% url 'detalle_pelicula' pelicula.id %}"
		       class="pelicula-caja">
		        <div class="pelicula-imagen">
		            <img src="{% static 'images/portadas/' %}{{ pelicula.titulo|slugify }}.jpg"
		                 alt="{{ pelicula.titulo }}">
		        </div>
		    </a>
		{% endfor %}
    </div>
</section>
{% endblock %}
